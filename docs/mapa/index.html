<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eixo Certo · mapa de arquitetura</title>

<style>
  :root{
    --canvas:#fafaf9; --surface:#ffffff; --border:#e8e6e5; --border-muted:#d6d3d1;
    --muted:#a8a29e; --body:#78716c; --primary:#0c0a09; --inverted:#1c1917;
    --wash:#c1e1f7; --accent:#3ba6f1; --edge:#3398e1;
    --r-card:10px; --r-pill:9999px;
    --font: Inter, "Inter Tight", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--canvas);color:var(--primary);font-family:var(--font);font-size:14px;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit}
  .app{display:grid;grid-template-rows:auto 1fr;grid-template-columns:minmax(0,1fr);height:100vh;height:100dvh}
  header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--canvas)}
  .brand{display:flex;flex-direction:column;min-width:220px;margin-right:auto}
  .brand h1{margin:0;font-size:18px;font-weight:400;letter-spacing:-.01em}
  .brand h1 b{font-weight:400;background:var(--wash);border-radius:4px;padding:0 4px}
  .brand small{color:var(--body);font-size:12px}
  .search{position:relative}
  .search input{width:230px;height:36px;border:1px solid var(--border);border-radius:6px;background:var(--surface);padding:0 10px 0 30px;font:inherit;color:var(--primary);outline:none}
  .search input:focus{border-color:var(--edge)}
  .search svg{position:absolute;left:9px;top:10px;color:var(--muted)}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border:1px solid var(--border);border-radius:var(--r-pill);background:var(--surface);cursor:pointer;font-size:12.5px;color:var(--body);user-select:none}
  .chip .dot{width:8px;height:8px;border-radius:50%}
  .chip[aria-pressed="true"]{color:var(--primary);border-color:var(--primary)}
  .tools{display:flex;gap:6px;align-items:center}
  .iconbtn{width:34px;height:34px;border:1px solid var(--border);border-radius:var(--r-pill);background:var(--surface);cursor:pointer;display:grid;place-items:center;color:var(--body)}
  .iconbtn:hover,.chip:hover{border-color:var(--border-muted);color:var(--primary)}
  .toggle{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--body);cursor:pointer;user-select:none}
  .toggle input{accent-color:var(--accent)}
  main{display:grid;grid-template-columns:minmax(0,1fr) 400px;min-height:0;min-width:0}
  .stage{position:relative;min-height:0;overflow:hidden;touch-action:none;cursor:grab}
  .stage.dragging{cursor:grabbing}
  svg#graph{width:100%;height:100%;display:block}
  aside{border-left:1px solid var(--border);background:var(--canvas);display:flex;flex-direction:column;min-height:0}
  .tabs{display:flex;gap:4px;padding:12px 12px 0}
  .tab{flex:1;height:32px;border:1px solid var(--border);border-radius:var(--r-pill);background:var(--surface);cursor:pointer;font-size:12.5px;color:var(--body)}
  .tab[aria-selected="true"]{background:var(--inverted);border-color:var(--inverted);color:#fff}
  .panel{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);padding:12px 14px}
  .flow{cursor:pointer}
  .flow:hover{border-color:var(--border-muted)}
  .flow.active{border-color:var(--edge)}
  .flow h3{margin:0 0 4px;font-size:14px;font-weight:500;display:flex;gap:8px;align-items:baseline}
  .flow h3 .fid{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .meta{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
  .tag{font-size:11px;padding:2px 8px;border-radius:var(--r-pill);border:1px solid var(--border);color:var(--body);background:var(--canvas)}
  .tag.us{border-color:var(--wash);background:#eef7fd;color:#1f6ea8}
  .tag.warn{border-color:#f3d9b5;background:#fdf6ec;color:#8a5a14}
  .tag.pr{border-color:#d8cdef;background:#f6f2fd;color:#5b3f9a}
  .muted{color:var(--body);font-size:12.5px;line-height:1.5}
  ol.steps{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
  ol.steps li{display:grid;grid-template-columns:24px 1fr;gap:8px;padding:6px 6px;border-radius:6px;cursor:pointer;align-items:start}
  ol.steps li:hover{background:var(--canvas)}
  ol.steps li.cur{background:#eef7fd}
  ol.steps .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;background:var(--canvas);border:1px solid var(--border);color:var(--body)}
  ol.steps li.cur .n{background:var(--accent);border-color:var(--accent);color:#fff}
  ol.steps .t{font-size:12.5px;line-height:1.45}
  ol.steps .t b{font-weight:500;font-family:var(--mono);font-size:11.5px}
  .player{display:flex;gap:6px;margin-top:10px;align-items:center}
  .btn{height:32px;padding:0 14px;border-radius:var(--r-pill);border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:12.5px}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .inv{margin:10px 0 0;padding-left:16px;color:var(--body);font-size:12px;line-height:1.5}
  h2{font-size:20px;font-weight:400;margin:0 0 2px;letter-spacing:-.01em;word-break:break-word}
  .kv{display:grid;grid-template-columns:76px 1fr;gap:6px 10px;font-size:12.5px;margin-top:10px}
  .kv dt{color:var(--muted)}
  .kv dd{margin:0}
  code,.mono{font-family:var(--mono);font-size:11.5px}
  .path{font-family:var(--mono);font-size:11.5px;color:var(--body);word-break:break-all}
  .links{display:flex;flex-direction:column;gap:2px;margin-top:4px}
  .link{display:flex;justify-content:space-between;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:12.5px;border:1px solid transparent}
  .link:hover{background:var(--canvas);border-color:var(--border)}
  .link small{color:var(--muted);font-family:var(--mono);font-size:10.5px;white-space:nowrap}
  .section{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 4px}
  .sev{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
  .empty{color:var(--body);font-size:13px;line-height:1.6;padding:8px 4px}
  .legend-row{display:flex;align-items:center;gap:10px;font-size:12.5px;padding:3px 0}
  #tip{position:fixed;pointer-events:none;z-index:10;max-width:340px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);padding:10px 12px;box-shadow:0 6px 24px rgba(12,10,9,.08);font-size:12.5px;line-height:1.45;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
  #tip.show{opacity:1;transform:none}
  #tip b{font-weight:500;font-size:13px}
  #tip .path{margin:2px 0 6px}
  /* svg */
  .col-bg{fill:#f5f5f4}
  .col-title{font-size:12px;fill:var(--body);letter-spacing:.06em;text-transform:uppercase}
  .node{cursor:pointer}
  .node .box{fill:var(--surface);stroke:var(--border);stroke-width:1}
  .node:hover .box{stroke:var(--border-muted)}
  .node .lbl{font-size:12.5px;fill:var(--primary);font-weight:500}
  .node .sub{font-size:10.5px;fill:var(--muted)}
  .node .badge rect{stroke-width:1}
  .node .badge text{font-size:9.5px}
  .node.dim{opacity:.16}
  .node.on .box{stroke:var(--edge)}
  .node.sel .box{stroke:var(--accent);stroke-width:2}
  .node.cur .ring{opacity:1}
  .node .ring{fill:none;stroke:var(--accent);stroke-width:6;opacity:0;stroke-opacity:.25}
  .node.status-placeholder .box,.node.status-sem-ui .box{stroke-dasharray:4 3}
  .fnum circle{fill:var(--accent)}
  .fnum text{fill:#fff;font-size:10px;font-weight:600}
  .edge{fill:none;stroke:#a8a29e;stroke-width:1.2;opacity:.42;transition:opacity .15s}
  .edge.k-navega{stroke:#c9c5c2;stroke-dasharray:4 4}
  .edge.k-le{stroke-dasharray:2 3}
  .edge.k-local{stroke:#78716c;stroke-dasharray:7 3}
  .edge.k-evento{stroke-dasharray:1 4;stroke-linecap:round;stroke-width:1.6}
  .edge.k-trigger{stroke:#78716c;stroke-dasharray:8 3 2 3}
  .edge.k-fk{stroke:#d6d3d1;stroke-dasharray:2 2}
  .edge.k-rpc{stroke:#44403c;stroke-width:1.6}
  .edge.k-rest{stroke:#78716c}
  .edge.k-storage{stroke:#78716c;stroke-width:1.6}
  .edge.k-chama{stroke:#8f8984}
  .edge.dim{opacity:.05}
  .edge.hot{stroke:var(--accent);opacity:1;stroke-width:2}
  .edge.hidden{display:none}
  .flowlink{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-dasharray:3 4;opacity:.9}
  .edge.hot.anim,.flowlink{animation:dash 1.2s linear infinite}
  @keyframes dash{to{stroke-dashoffset:-14}}
  .edge.hot.anim{stroke-dasharray:6 4}
  @media (prefers-reduced-motion: reduce){.edge.hot.anim,.flowlink{animation:none}}
  @media (max-width: 960px){
    main{grid-template-columns:minmax(0,1fr);grid-template-rows:1fr 46vh}
    aside{border-left:0;border-top:1px solid var(--border)}
    .search input{width:170px}
    .brand{min-width:0;flex-basis:100%}
    header{gap:8px;padding:10px 12px}
    .chips{flex-wrap:nowrap;overflow-x:auto;width:100%;min-width:0;max-width:100%;scrollbar-width:none}
    .chips::-webkit-scrollbar{display:none}
    .chip{flex:none}
    .search{flex:1}.search input{width:100%}
  }
</style>

er":"Financeiro → Lançamentos por viagem","steps":[{"node":"v_hub_fin","action":"Atalho Lançamentos por viagem"},{"node":"r_ponte","action":"/viagens/lancamentos → /viagens/[id]"},{"node":"v_ponte","action":"Lista de viagens e detalhe com totais"},{"node":"d_ponte","action":"listarViagensVinculaveis / buscarViagemVinculavel"},{"node":"rpc_vinc","action":"Definer: só placa, rota, status e datas"},{"node":"t_viagem","action":"Lido pela RPC, nunca pelo Financeiro direto"},{"node":"d_ponte","action":"listarLancamentosDaViagem / desvincularLancamento"},{"node":"t_mov","action":"select por viagem_id; desvincular = viagem_id null"}],"invariants":["Só src/features/ponte-viagem conhece os dois módulos."]},{"id":"F11","name":"Estatísticas e ranking de eficiência (BI)","module":"bi","us":["US10","US13"],"rnf":["RNF06"],"actor":"Admin / Gestor / Financeiro","trigger":"Aba Dashboards (PR #56)","steps":[{"node":"r_tab_dash","action":"Na main: placeholder. No PR #56: RankingView"},{"node":"v_ranking","action":"Abas Rotas/Veículos + FiltroPeriodo"},{"node":"v_filtro","action":"Mês, ano ou intervalo (≤ 366 dias)"},{"node":"d_ranking","action":"buscarRanking: Top 3, posição com empate"},{"node":"d_bi","action":"listarEstatisticasRotas/Veiculos + Zod"},{"node":"rpc_est","action":"Definer; checa perfil e período; só agregados"},{"node":"vw_estat","action":"Uma fórmula por viagem: receita, despesa, KM, litros"},{"node":"t_viagem","action":"Só viagens Finalizada entram em rota/veículo"}],"invariants":["Agregação só no banco (RNF06).","Gestor vê totais, nunca lançamentos."]},{"id":"F12","name":"Cadastro simples com soft delete","module":"fin","us":["US01","US02","US06","US07"],"actor":"Admin / Financeiro / Gestor","trigger":"Categorias, Formas, Veículos ou Rotas","steps":[{"node":"v_hub_fin","action":"Atalho Categorias (mesmo padrão em Formas, Veículos, Rotas)"},{"node":"r_categorias","action":"/categorias"},{"node":"v_categorias","action":"Abas Entrada/Saída; Switch ativa; form com Zod"},{"node":"d_categorias","action":"criar / atualizar / definirAtivaCategoria"},{"node":"t_categoria","action":"RLS Admin/Financeiro; sem policy de delete"},{"node":"d_veiculos","action":"Veículos: inativar/reativar"},{"node":"t_veiculo","action":"update status"},{"node":"tg_status_veiculo","action":"Reativação grava o status real (viagem/manutenção aberta)"}],"invariants":["Nunca DELETE físico.","Inativo some do seletor, continua no histórico."]}]}</script>
<script>
(() => {
  const D = JSON.parse(document.getElementById('data').textContent);
  const NS = 'http://www.w3.org/2000/svg';
  const MODCOLOR = {auth:'#7c6fb0',nav:'#a8a29e',fin:'#2f9e74',frota:'#c58a2b',viagem:'#d0643b',ponte:'#8a5cc2',bi:'#3b82c4',shared:'#57534e'};
  const KIND = {layout:'layout',route:'rota',tab:'aba',screen:'tela',component:'componente',store:'store',lib:'lib',service:'serviço',
    repository:'repositório',hook:'hook',infra:'infra',external:'serviço Supabase','sql-function':'função SQL',rpc:'RPC',table:'tabela',view:'view',trigger:'trigger'};
  const STATUS = {'pr-56':['PR #56','pr'],'sem-ui':['sem UI','warn'],'placeholder':['placeholder','warn']};
  const EDGEKIND = {guarda:'guard de rota',renderiza:'renderiza',navega:'navega (router.push)',chama:'chama função',le:'lê / consulta',
    rest:'PostgREST + RLS',rpc:'supabase.rpc()',storage:'Supabase Storage',local:'SQLite / armazenamento local',evento:'evento / listener',trigger:'dispara trigger',fk:'chave estrangeira'};

  const byId = Object.fromEntries(D.nodes.map(n => [n.id, n]));
  const out = {}, inc = {};
  D.nodes.forEach(n => { out[n.id] = []; inc[n.id] = []; });
  D.edges.forEach((e, i) => { e.i = i; out[e.from].push(e); inc[e.to].push(e); });
  const flowsOf = id => D.flows.filter(f => f.steps.some(s => s.node === id));

  // ---------- layout
  const G = {colW: 272, w: 226, h: 42, gap: 8, modGap: 18, top: 84, left: 36};
  const pos = {};
  let maxY = 0;
  D.layers.forEach((L, li) => {
    let y = G.top, prev = null;
    D.nodes.filter(n => n.layer === L.id).forEach(n => {
      if (prev && prev !== n.module) y += G.modGap - G.gap;
      pos[n.id] = {x: G.left + li * G.colW, y, w: G.w, h: G.h, li};
      y += G.h + G.gap; prev = n.module;
    });
    maxY = Math.max(maxY, y);
  });
  const WORLD = {w: G.left * 2 + D.layers.length * G.colW - (G.colW - G.w), h: maxY + 30};

  const el = (tag, attrs = {}, parent) => {
    const x = document.createElementNS(NS, tag);
    for (const k in attrs) x.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(x);
    return x;
  };

  // columns
  const cols = document.getElementById('cols');
  D.layers.forEach((L, li) => {
    const x = G.left + li * G.colW;
    el('rect', {class: 'col-bg', x: x - 12, y: 52, width: G.w + 24, height: maxY - 40, rx: 14}, cols);
    const t = el('text', {class: 'col-title', x: x, y: 40}, cols);
    t.textContent = L.label;
  });

  // edges
  const gE = document.getElementById('edges');
  function edgePath(a, b) {
    const A = pos[a], B = pos[b];
    if (A.li < B.li) {
      const x1 = A.x + A.w, y1 = A.y + A.h / 2, x2 = B.x, y2 = B.y + B.h / 2, dx = Math.max(40, (x2 - x1) / 2);
      return `M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}`;
    }
    if (A.li > B.li) {
      const x1 = A.x, y1 = A.y + A.h / 2 + 6, x2 = B.x + B.w, y2 = B.y + B.h / 2 + 6, dx = Math.max(50, (x1 - x2) / 2);
      return `M${x1},${y1} C${x1 - dx},${y1 + 18} ${x2 + dx},${y2 + 18} ${x2},${y2}`;
    }
    const x = A.x + A.w, y1 = A.y + A.h / 2, y2 = B.y + B.h / 2, bulge = 22 + Math.min(110, Math.abs(y2 - y1) * 0.22);
    return `M${x},${y1} C${x + bulge},${y1} ${x + bulge},${y2} ${x},${y2}`;
  }
  const edgeEls = D.edges.map(e => {
    const p = el('path', {class: `edge k-${e.kind}`, d: edgePath(e.from, e.to), 'marker-end': 'url(#ar)'}, gE);
    return p;
  });

  // nodes
  const gN = document.getElementById('nodes');
  const nodeEls = {};
  const trunc = (s, n) => s.length > n ? s.slice(0, n - 1) + '…' : s;
  D.nodes.forEach(n => {
    const P = pos[n.id];
    const g = el('g', {class: `node status-${n.status}`, transform: `translate(${P.x},${P.y})`, 'data-id': n.id, tabindex: 0, role: 'button', 'aria-label': n.label}, gN);
    el('rect', {class: 'ring', x: -3, y: -3, width: P.w + 6, height: P.h + 6, rx: 11}, g);
    el('rect', {class: 'box', width: P.w, height: P.h, rx: 8}, g);
    el('rect', {x: 6, y: 9, width: 3, height: P.h - 18, rx: 1.5, fill: MODCOLOR[n.module] || '#a8a29e'}, g);
    const st = STATUS[n.status];
    const maxChars = st ? 22 : 29;
    const t = el('text', {class: 'lbl', x: 16, y: 18}, g); t.textContent = trunc(n.label, maxChars);
    const s = el('text', {class: 'sub', x: 16, y: 32}, g);
    s.textContent = trunc(`${KIND[n.kind] || n.kind} · ${D.modules[n.module]}`, 36);
    if (st) {
      const bw = st[0].length * 5.6 + 12;
      const b = el('g', {class: 'badge', transform: `translate(${P.w - bw - 6},6)`}, g);
      const c = st[1] === 'pr' ? ['#f6f2fd', '#d8cdef', '#5b3f9a'] : ['#fdf6ec', '#f3d9b5', '#8a5a14'];
      el('rect', {width: bw, height: 15, rx: 7.5, fill: c[0], stroke: c[1]}, b);
      const bt = el('text', {x: bw / 2, y: 11, 'text-anchor': 'middle', fill: c[2]}, b); bt.textContent = st[0];
    }
    el('g', {class: 'fnum'}, g);
    nodeEls[n.id] = g;
  });

  // ---------- view transform
  const svg = document.getElementById('graph'), vp = document.getElementById('vp'), stage = document.getElementById('stage');
  let V = {x: 0, y: 0, k: 1};
  const apply = () => vp.setAttribute('transform', `translate(${V.x},${V.y}) scale(${V.k})`);
  let anim = null;
  function animateTo(T, ms = 320) {
    cancelAnimationFrame(anim);
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) { V = T; apply(); return; }
    const S = {...V}, t0 = performance.now();
    const step = now => {
      const p = Math.min(1, (now - t0) / ms), e = 1 - Math.pow(1 - p, 3);
      V = {x: S.x + (T.x - S.x) * e, y: S.y + (T.y - S.y) * e, k: S.k + (T.k - S.k) * e}; apply();
      if (p < 1) anim = requestAnimationFrame(step);
    };
    anim = requestAnimationFrame(step);
  }
  function fitBox(b, pad = 40, maxK = 1.4) {
    const r = stage.getBoundingClientRect();
    const k = Math.min(maxK, (r.width - pad * 2) / b.w, (r.height - pad * 2) / b.h);
    return {k, x: r.width / 2 - (b.x + b.w / 2) * k, y: r.height / 2 - (b.y + b.h / 2) * k};
  }
  const fitAll = () => animateTo(fitBox({x: 0, y: 20, w: WORLD.w, h: WORLD.h}, 20));
  function fitNodes(ids) {
    if (!ids.length) return;
    let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
    ids.forEach(id => { const P = pos[id]; x1 = Math.min(x1, P.x); y1 = Math.min(y1, P.y); x2 = Math.max(x2, P.x + P.w); y2 = Math.max(y2, P.y + P.h); });
    animateTo(fitBox({x: x1 - 30, y: y1 - 30, w: x2 - x1 + 60, h: y2 - y1 + 60}, 30, 1.2));
  }
  function centerOn(id) {
    const r = stage.getBoundingClientRect(), P = pos[id], k = Math.max(V.k, 0.9);
    animateTo({k, x: r.width / 2 - (P.x + P.w / 2) * k, y: r.height / 2 - (P.y + P.h / 2) * k});
  }
  function zoomAt(f, cx, cy) {
    const k = Math.max(0.15, Math.min(3, V.k * f));
    V = {k, x: cx - (cx - V.x) * (k / V.k), y: cy - (cy - V.y) * (k / V.k)}; apply();
  }

  // pan / pinch / click
  const pts = new Map(); let drag = null, moved = 0, pinch = null;
  stage.addEventListener('pointerdown', ev => {
    stage.setPointerCapture(ev.pointerId);
    pts.set(ev.pointerId, {x: ev.clientX, y: ev.clientY});
    moved = 0;
    if (pts.size === 1) drag = {x: ev.clientX, y: ev.clientY, vx: V.x, vy: V.y, target: ev.target};
    if (pts.size === 2) {
      const [a, b] = [...pts.values()];
      pinch = {d: Math.hypot(a.x - b.x, a.y - b.y), k: V.k}; drag = null;
    }
  });
  stage.addEventListener('pointermove', ev => {
    if (!pts.has(ev.pointerId)) return;
    pts.set(ev.pointerId, {x: ev.clientX, y: ev.clientY});
    if (pinch && pts.size === 2) {
      const [a, b] = [...pts.values()], r = stage.getBoundingClientRect();
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      zoomAt((pinch.k * d / pinch.d) / V.k, (a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top); moved = 99; return;
    }
    if (!drag) return;
    const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
    moved = Math.max(moved, Math.abs(dx) + Math.abs(dy));
    if (moved > 4) { stage.classList.add('dragging'); hideTip(); V.x = drag.vx + dx; V.y = drag.vy + dy; apply(); }
  });
  const end = ev => {
    if (!pts.has(ev.pointerId)) return;
    pts.delete(ev.pointerId);
    if (pts.size < 2) pinch = null;
    if (drag && moved <= 4) {
      const nodeG = drag.target.closest && drag.target.closest('.node');
      if (nodeG) selectNode(nodeG.dataset.id, true); else clearSelection();
    }
    drag = null; stage.classList.remove('dragging');
  };
  stage.addEventListener('pointerup', end);
  stage.addEventListener('pointercancel', end);
  stage.addEventListener('wheel', ev => {
    ev.preventDefault();
    const r = stage.getBoundingClientRect();
    zoomAt(Math.exp(-ev.deltaY * 0.0015), ev.clientX - r.left, ev.clientY - r.top);
  }, {passive: false});
  document.getElementById('zIn').onclick = () => { const r = stage.getBoundingClientRect(); zoomAt(1.25, r.width / 2, r.height / 2); };
  document.getElementById('zOut').onclick = () => { const r = stage.getBoundingClientRect(); zoomAt(0.8, r.width / 2, r.height / 2); };
  document.getElementById('zFit').onclick = fitAll;

  // ---------- tooltip
  const tip = document.getElementById('tip');
  function showTip(n, ev) {
    tip.replaceChildren();
    const b = document.createElement('b'); b.textContent = n.label; tip.appendChild(b);
    const p = document.createElement('div'); p.className = 'path'; p.textContent = n.path; tip.appendChild(p);
    const s = document.createElement('div'); s.textContent = n.summary; tip.appendChild(s);
    const extra = [...n.us, ...n.rnf].join(' · ') + (n.perfis.length ? `  —  ${n.perfis.join(', ')}` : '');
    if (extra.trim()) { const m = document.createElement('div'); m.className = 'muted'; m.style.marginTop = '6px'; m.textContent = extra; tip.appendChild(m); }
    moveTip(ev); tip.classList.add('show');
  }
  function moveTip(ev) {
    const w = tip.offsetWidth || 300, h = tip.offsetHeight || 120;
    let x = ev.clientX + 14, y = ev.clientY + 14;
    if (x + w > innerWidth - 8) x = ev.clientX - w - 14;
    if (y + h > innerHeight - 8) y = ev.clientY - h - 14;
    tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px';
  }
  const hideTip = () => tip.classList.remove('show');
  Object.entries(nodeEls).forEach(([id, g]) => {
    g.addEventListener('pointerenter', ev => { if (ev.pointerType === 'mouse' && !drag) showTip(byId[id], ev); });
    g.addEventListener('pointermove', ev => { if (ev.pointerType === 'mouse' && tip.classList.contains('show')) moveTip(ev); });
    g.addEventListener('pointerleave', hideTip);
    g.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); selectNode(id, true); } });
  });

  // ---------- state & highlight
  const S = {sel: null, flow: null, step: -1, q: '', mods: new Set(), focus: null, nav: true, fk: true};
  let playTimer = null;

  function matches(n, q) {
    const hay = [n.id, n.label, n.path, n.summary, ...n.us, ...n.rnf, ...n.api, n.kind].join(' ').toLowerCase();
    return q.split(/\s+/).every(w => hay.includes(w));
  }

  function highlight() {
    let nodesOn = null, edgesOn = new Set(), numbers = {};
    const gL = document.getElementById('flowlinks'); gL.replaceChildren();
    if (S.flow) {
      const f = D.flows.find(x => x.id === S.flow);
      nodesOn = new Set(f.steps.map(s => s.node));
      f.steps.forEach((s, i) => (numbers[s.node] = numbers[s.node] || []).push(i + 1));
      for (let i = 0; i < f.steps.length - 1; i++) {
        const a = f.steps[i].node, b = f.steps[i + 1].node;
        if (a === b) continue;
        const hit = D.edges.filter(e => (e.from === a && e.to === b) || (e.from === b && e.to === a));
        if (hit.length) hit.forEach(e => edgesOn.add(e.i));
        else {
          const A = pos[a], B = pos[b];
          el('path', {class: 'flowlink', d: `M${A.x + A.w / 2},${A.y + A.h / 2} L${B.x + B.w / 2},${B.y + B.h / 2}`}, gL);
        }
      }
    } else if (S.sel) {
      nodesOn = new Set([S.sel]);
      out[S.sel].forEach(e => { nodesOn.add(e.to); edgesOn.add(e.i); });
      inc[S.sel].forEach(e => { nodesOn.add(e.from); edgesOn.add(e.i); });
    } else if (S.focus) {
      nodesOn = new Set(S.focus);
    } else if (S.q) {
      nodesOn = new Set(D.nodes.filter(n => matches(n, S.q)).map(n => n.id));
    }
    const modOk = n => !S.mods.size || S.mods.has(n.module);
    const cur = S.flow && S.step >= 0 ? D.flows.find(x => x.id === S.flow).steps[S.step].node : null;
    D.nodes.forEach(n => {
      const g = nodeEls[n.id];
      const on = nodesOn ? nodesOn.has(n.id) : true;
      g.classList.toggle('dim', !on || !modOk(n));
      g.classList.toggle('on', !!nodesOn && on && !!(S.flow || S.sel));
      g.classList.toggle('sel', n.id === S.sel);
      g.classList.toggle('cur', n.id === cur);
      const fn = g.querySelector('.fnum'); fn.replaceChildren();
      if (numbers[n.id]) {
        const label = numbers[n.id].join('·'), w = Math.max(18, label.length * 6.4 + 8);
        el('rect', {x: -9, y: -9, width: w, height: 18, rx: 9, fill: '#3ba6f1'}, fn);
        const t = el('text', {x: -9 + w / 2, y: 4, 'text-anchor': 'middle'}, fn); t.textContent = label;
      }
    });
    D.edges.forEach(e => {
      const p = edgeEls[e.i];
      const hidden = (e.kind === 'navega' && !S.nav) || (e.kind === 'fk' && !S.fk);
      const hot = edgesOn.has(e.i);
      p.classList.toggle('hidden', hidden && !hot);
      p.classList.toggle('hot', hot);
      p.classList.toggle('anim', hot && !!S.flow);
      const dimmed = (nodesOn && !hot) || (S.mods.size && !(S.mods.has(byId[e.from].module) || S.mods.has(byId[e.to].module)));
      p.classList.toggle('dim', !!dimmed);
      p.setAttribute('marker-end', hot ? 'url(#arHot)' : 'url(#ar)');
      if (hot) gE.appendChild(p);
    });
  }

  function selectNode(id, fromCanvas) {
    S.sel = id; S.focus = null;
    if (!fromCanvas) centerOn(id);
    highlight(); setTab('no'); panel.scrollTop = 0;
  }
  function clearSelection() { S.sel = null; S.focus = null; highlight(); if (curTab === 'no') render(); }
  function setFlow(id) {
    stop();
    S.flow = S.flow === id ? null : id; S.step = -1; S.sel = null; S.focus = null;
    highlight(); render();
    if (S.flow) fitNodes(D.flows.find(f => f.id === id).steps.map(s => s.node));
  }
  function setStep(i) {
    S.step = i; highlight(); render();
    const f = D.flows.find(x => x.id === S.flow);
    if (f && f.steps[i]) centerOn(f.steps[i].node);
  }
  function stop() { clearInterval(playTimer); playTimer = null; }
  function play() {
    const f = D.flows.find(x => x.id === S.flow); if (!f) return;
    if (playTimer) { stop(); render(); return; }
    let i = S.step >= f.steps.length - 1 ? 0 : S.step + 1;
    setStep(i);
    playTimer = setInterval(() => {
      i++;
      if (i >= f.steps.length) { stop(); render(); return; }
      setStep(i);
    }, 1400);
    render();
  }

  // ---------- panel
  const panel = document.getElementById('panel');
  let curTab = 'fluxos';
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => setTab(b.dataset.tab));
  function setTab(t) {
    if (curTab !== t) panel.scrollTop = 0;
    curTab = t;
    document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === t));
    render();
  }
  const h = (tag, cls, text) => { const x = document.createElement(tag); if (cls) x.className = cls; if (text != null) x.textContent = text; return x; };
  const tags = (arr, cls) => { const m = h('div', 'meta'); arr.forEach(t => m.appendChild(h('span', 'tag ' + (cls || ''), t))); return m; };

  function render() {
    panel.replaceChildren();
    if (curTab === 'fluxos') renderFlows();
    if (curTab === 'no') renderNode();
    if (curTab === 'legenda') renderLegend();
  }

  function renderFlows() {
    panel.appendChild(h('div', 'muted', 'Toque num fluxo para destacar o caminho no diagrama. Os números nos nós são a ordem dos passos; tracejado azul = salto sem chamada direta.'));
    D.flows.forEach(f => {
      const c = h('div', 'card flow' + (S.flow === f.id ? ' active' : ''));
      const t = h('h3'); t.appendChild(h('span', 'fid', f.id)); t.appendChild(h('span', '', f.name)); c.appendChild(t);
      c.appendChild(h('div', 'muted', `${f.actor} · ${f.trigger}`));
      c.appendChild(tags([...f.us, ...(f.rnf || [])], 'us'));
      c.onclick = ev => { if (ev.target.closest('ol,.player')) return; setFlow(f.id); };
      if (S.flow === f.id) {
        const ol = h('ol', 'steps');
        f.steps.forEach((s, i) => {
          const li = h('li', i === S.step ? 'cur' : '');
          li.appendChild(h('span', 'n', String(i + 1)));
          const tx = h('span', 't'); tx.appendChild(h('b', '', byId[s.node].label)); tx.appendChild(document.createElement('br')); tx.appendChild(document.createTextNode(s.action));
          li.appendChild(tx);
          li.onclick = () => { stop(); setStep(i); };
          ol.appendChild(li);
        });
        c.appendChild(ol);
        const pl = h('div', 'player');
        const prev = h('button', 'btn', '◀'); prev.setAttribute('aria-label', 'Passo anterior');
        prev.onclick = () => { stop(); setStep(Math.max(0, S.step - 1)); };
        const nx = h('button', 'btn', '▶'); nx.setAttribute('aria-label', 'Próximo passo');
        nx.onclick = () => { stop(); setStep(Math.min(f.steps.length - 1, S.step + 1)); };
        const pb = h('button', 'btn primary', playTimer ? 'Pausar' : 'Reproduzir'); pb.onclick = play;
        const cl = h('button', 'btn', 'Limpar'); cl.onclick = () => setFlow(f.id);
        [prev, nx, pb, cl].forEach(b => pl.appendChild(b));
        c.appendChild(pl);
        if (f.invariants && f.invariants.length) {
          const ul = h('ul', 'inv'); f.invariants.forEach(x => ul.appendChild(h('li', '', x))); c.appendChild(ul);
        }
      }
      panel.appendChild(c);
    });
  }

  function linkRow(e, dir) {
    const other = dir === 'out' ? e.to : e.from;
    const r = h('div', 'link');
    r.appendChild(h('span', '', (dir === 'out' ? '→ ' : '← ') + byId[other].label));
    r.appendChild(h('small', '', e.label ? `${e.kind} · ${e.label}` : e.kind));
    r.title = e.label || EDGEKIND[e.kind];
    r.onclick = () => selectNode(other);
    return r;
  }

  function renderNode() {
    const n = byId[S.sel];
    if (!n) { panel.appendChild(h('div', 'empty', 'Toque num nó do diagrama para ver o arquivo, o que ele faz, quem o chama e o que ele chama. As conexões diretas ficam em destaque.')); return; }
    const c = h('div', 'card');
    c.appendChild(h('h2', '', n.label));
    const tg = [KIND[n.kind] || n.kind, D.modules[n.module]];
    c.appendChild(tags(tg));
    if (STATUS[n.status]) c.appendChild(tags([STATUS[n.status][0]], STATUS[n.status][1]));
    c.appendChild(h('div', 'path', n.path)).style.marginTop = '8px';
    c.appendChild(h('p', 'muted', n.summary));
    const dl = h('dl', 'kv');
    const add = (k, v) => { if (!v) return; dl.appendChild(h('dt', '', k)); dl.appendChild(h('dd', '', v)); };
    add('US', n.us.join(', ')); add('RNF', n.rnf.join(', ')); add('Perfis', n.perfis.join(', '));
    if (dl.children.length) c.appendChild(dl);
    if (n.api.length) {
      c.appendChild(h('div', 'section', 'API / exports'));
      const m = h('div', 'meta'); n.api.forEach(a => m.appendChild(h('code', 'tag', a))); c.appendChild(m);
    }
    panel.appendChild(c);
    const io = h('div', 'card');
    io.appendChild(h('div', 'section', `Chama / aponta para (${out[n.id].length})`));
    const lo = h('div', 'links'); out[n.id].forEach(e => lo.appendChild(linkRow(e, 'out'))); io.appendChild(lo);
    io.appendChild(h('div', 'section', `Usado por (${inc[n.id].length})`));
    const li = h('div', 'links'); inc[n.id].forEach(e => li.appendChild(linkRow(e, 'in'))); io.appendChild(li);
    panel.appendChild(io);
    const fl = flowsOf(n.id);
    if (fl.length) {
      const fc = h('div', 'card');
      fc.appendChild(h('div', 'section', 'Aparece nos fluxos'));
      const l = h('div', 'links');
      fl.forEach(f => { const r = h('div', 'link'); r.appendChild(h('span', '', f.name)); r.appendChild(h('small', '', f.id)); r.onclick = () => { setTab('fluxos'); setFlow(f.id); }; l.appendChild(r); });
      fc.appendChild(l); panel.appendChild(fc);
    }
  }

  function renderLegend() {
    const c = h('div', 'card');
    c.appendChild(h('div', 'section', 'Módulos (barra à esquerda do nó)'));
    Object.entries(D.modules).forEach(([k, v]) => {
      const r = h('div', 'legend-row'); const d = h('span', 'sev'); d.style.background = MODCOLOR[k]; r.appendChild(d); r.appendChild(h('span', '', v)); c.appendChild(r);
    });
    c.appendChild(h('div', 'section', 'Conexões'));
    Object.entries(EDGEKIND).forEach(([k, v]) => {
      const r = h('div', 'legend-row');
      const s = document.createElementNS(NS, 'svg'); s.setAttribute('width', 46); s.setAttribute('height', 10);
      const p = el('path', {d: 'M2,5 L44,5', class: `edge k-${k}`}, s); p.style.opacity = 1;
      r.appendChild(s); r.appendChild(h('span', '', `${k} — ${v}`)); c.appendChild(r);
    });
    c.appendChild(h('div', 'section', 'Selos'));
    [['PR #56', 'pr', 'existe só na branch feat/eix-46-us13-ranking'], ['sem UI', 'warn', 'pronto no código/banco, nenhuma tela usa na main'], ['placeholder', 'warn', 'tela provisória']].forEach(([a, cls, d]) => {
      const r = h('div', 'legend-row'); r.appendChild(h('span', 'tag ' + cls, a)); r.appendChild(h('span', 'muted', d)); c.appendChild(r);
    });
    c.appendChild(h('div', 'section', 'Atalhos'));
    c.appendChild(h('div', 'muted', 'Arrastar move · roda ou pinça dá zoom · clique no fundo limpa a seleção · Esc limpa tudo · "/" busca.'));
    panel.appendChild(c);
  }

  // ---------- header controls
  const chips = document.getElementById('modchips');
  Object.entries(D.modules).forEach(([k, v]) => {
    const b = h('button', 'chip'); b.setAttribute('aria-pressed', 'false');
    const d = h('span', 'dot'); d.style.background = MODCOLOR[k]; b.appendChild(d); b.appendChild(document.createTextNode(v));
    b.onclick = () => { S.mods.has(k) ? S.mods.delete(k) : S.mods.add(k); b.setAttribute('aria-pressed', S.mods.has(k)); highlight(); };
    chips.appendChild(b);
  });
  const q = document.getElementById('q');
  q.addEventListener('input', () => { S.q = q.value.trim().toLowerCase(); S.sel = null; S.flow = null; S.focus = null; stop(); highlight(); if (curTab !== 'legenda') render(); });
  q.addEventListener('keydown', ev => {
    if (ev.key === 'Enter') { const m = D.nodes.find(n => matches(n, S.q)); if (m) selectNode(m.id); }
  });
  document.getElementById('tNav').onchange = ev => { S.nav = ev.target.checked; highlight(); };
  document.getElementById('tFk').onchange = ev => { S.fk = ev.target.checked; highlight(); };
  addEventListener('keydown', ev => {
    if (ev.key === 'Escape') { stop(); S.sel = null; S.flow = null; S.focus = null; S.step = -1; S.q = ''; q.value = ''; highlight(); render(); }
    if (ev.key === '/' && document.activeElement !== q) { ev.preventDefault(); q.focus(); }
  });

  document.getElementById('stats').textContent =
    `${D.nodes.length} nós · ${D.edges.length} conexões · ${D.flows.length} fluxos · ${D.meta.baseline.branch} @ ${D.meta.baseline.commit} · ${D.meta.baseline.generatedAt}`;

  addEventListener('resize', () => {});
  highlight(); render();
  requestAnimationFrame(() => { const b = fitBox({x: 0, y: 20, w: WORLD.w, h: WORLD.h}, 20); V = b; apply(); });
})();
</script>
</body>
</html>
